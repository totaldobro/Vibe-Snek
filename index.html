<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Vibe Snek</title>
<style>
:root{color-scheme:dark;--bg:#101820;--green:#73e2a7;--text:#edf5f2}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg);color:var(--text);font:16px system-ui,sans-serif}
main{width:min(94vw,560px)}h1{margin:0 0 8px;font-size:clamp(2rem,6vw,2.8rem);letter-spacing:-.04em}
.top{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:14px}
.score{background:#17232d;padding:9px 14px;border-radius:12px;font-weight:700}
canvas{display:block;width:100%;aspect-ratio:1;background:#0c141a;border:1px solid #2a3a43;border-radius:14px;box-shadow:0 16px 50px #0005}
.controls{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}
button{border:0;border-radius:10px;background:var(--green);color:#102019;padding:10px 15px;font:700 15px system-ui;cursor:pointer;margin:0 4px 4px 0}
.hint{color:#b4c5ca;font-size:13px;line-height:1.5}
.pad{display:grid;grid-template-columns:repeat(3,42px);grid-template-rows:repeat(2,38px);gap:5px}
.pad button{padding:0;font-size:18px;background:#263943;color:var(--text)}
.pad .up{grid-column:2;grid-row:1}.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}
@media(min-width:600px){.pad{display:none}}
#splash{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:#101820f2;border-radius:14px;z-index:2}
#board-wrap{position:relative}
#splash h2{font-size:clamp(1.8rem,5vw,2.5rem);margin:0}
#splash p{margin:0;color:#b4c5ca}
.difficulty{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.difficulty button{min-width:90px}
.difficulty button[aria-pressed="true"]{outline:3px solid #fff;outline-offset:2px}
#play{min-width:160px;font-size:17px}
#countdown{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  z-index:3;background:#07101655;color:#f0e7c8;
  font-family:'Courier New',monospace;font-size:clamp(5rem,20vw,9rem);
  font-weight:900;line-height:1;letter-spacing:.04em;
  -webkit-text-stroke:2px #242629;
  text-shadow:4px 0 #242629,-4px 0 #242629,0 4px #242629,0 -4px #242629,
    4px 4px #242629,-4px 4px #242629,4px -4px #242629,-4px -4px #242629,
    0 7px 0 #090b0c,0 0 18px #73e2a755;
  pointer-events:none}

/* Dungeon-menu theme: stone gray, serpent green, and steak red */
:root{
  color-scheme:dark;
  --bg:#202522;
  --green:#78b85b;
  --text:#e2e4dc;
  --stone:#777c73;
  --stone-dark:#343a35;
  --red:#b8433e;
}
body{
  background:
    radial-gradient(ellipse at 50% 0%, #454b42 0%, #292e2a 48%, #191d1a 100%);
  color:var(--text);
}
h1{
  color:#a4d486;
  text-shadow:2px 2px 0 #111610, 4px 4px 0 #111610;
  letter-spacing:.04em;
  text-transform:uppercase;
}
.score{
  background:#343a35;
  border:2px solid #777c73;
  border-bottom-color:#171b18;
  border-right-color:#171b18;
  border-radius:3px;
  box-shadow:inset 2px 2px 0 #50574f;
  color:#f0eee2;
}
button{
  border:2px solid #a2c77f;
  border-radius:3px;
  background:#527d3e;
  color:#f0f2e9;
  box-shadow:inset 2px 2px 0 #83b568, inset -2px -2px 0 #36542c, 0 3px 0 #111610;
  text-transform:uppercase;
  letter-spacing:.035em;
  text-shadow:1px 1px 0 #26351f;
  transition:filter .12s, transform .12s, background .12s;
}
button:hover{filter:brightness(1.15)}
button:active{transform:translateY(2px);box-shadow:inset 2px 2px 0 #36542c}
button:focus-visible{outline:3px solid #e6e7d9;outline-offset:3px}
#board-wrap{border-radius:4px}
canvas{
  border:4px solid #777c73;
  border-radius:3px;
  box-shadow:0 0 0 3px #171b18, 0 12px 35px #0008;
}
.controls{margin-top:16px}
.hint{color:#c0c5b8}
.pad button{
  border-color:#777c73;
  background:#414740;
  color:#e3e6dc;
  box-shadow:inset 2px 2px 0 #60675d, inset -2px -2px 0 #292e29, 0 3px 0 #111610;
}
#splash{
  gap:16px;
  padding:clamp(18px,4vw,30px);
  border:4px solid #777c73;
  border-radius:3px;
  background:
    linear-gradient(135deg, #424840 0%, #303630 48%, #252a25 100%);
  box-shadow:inset 0 0 0 3px #1b201b, inset 0 0 0 6px #535a50;
}
#splash h2{
  color:#a4d486;
  font-size:clamp(2rem,6vw,3rem);
  text-transform:uppercase;
  letter-spacing:.08em;
  text-shadow:3px 3px 0 #141914, 5px 5px 0 #141914;
}
#splash p{color:#d0d4c8}
#splash p:first-of-type{
  color:#d1d5c9;
  text-transform:uppercase;
  letter-spacing:.12em;
  font-size:.82rem;
  font-weight:800;
}
.difficulty{gap:10px}
.difficulty button{
  min-width:92px;
  background:#414740;
  border-color:#777c73;
  color:#e1e4d9;
  box-shadow:inset 2px 2px 0 #60675d, inset -2px -2px 0 #292e29, 0 3px 0 #151915;
}
.difficulty button[aria-pressed="true"]{
  background:#527d3e;
  border-color:#a2c77f;
  box-shadow:inset 2px 2px 0 #83b568, inset -2px -2px 0 #36542c, 0 3px 0 #151915;
  outline:2px solid #d7dfca;
  outline-offset:3px;
}
#difficulty-description{
  color:#aeb6a6;
  font-size:.9rem;
}
#play{
  min-width:170px;
  margin-top:2px;
  padding:12px 22px;
  background:#b8433e;
  border-color:#e07a68;
  color:#fff0e7;
  box-shadow:inset 2px 2px 0 #df7162, inset -2px -2px 0 #782a29, 0 4px 0 #171411;
  font-size:1.05rem;
}
#play:active{box-shadow:inset 2px 2px 0 #782a29}
#start{background:#527d3e}
#pause{background:#555d53;border-color:#9da397;box-shadow:inset 2px 2px 0 #788071,inset -2px -2px 0 #363b34,0 3px 0 #111610}
#sound,#music{background:#414740;border-color:#777c73;box-shadow:inset 2px 2px 0 #60675d,inset -2px -2px 0 #292e29,0 3px 0 #111610}
#countdown{
  background:#20282077;
  color:#a4d486;
  -webkit-text-stroke:2px #171b18;
  text-shadow:4px 0 #171b18,-4px 0 #171b18,0 4px #171b18,0 -4px #171b18,
    4px 4px #171b18,-4px 4px #171b18,4px -4px #171b18,-4px -4px #171b18,
    0 7px 0 #090b0c,0 0 18px #78b85b66;
}
@media(max-width:420px){
  body{padding:12px}
  #splash{gap:12px}
  .difficulty button{min-width:78px;padding:9px 10px}
  .controls button{font-size:13px;padding:9px 10px}
}


/* Match the menu to the exact stone pattern drawn on the game canvas.
   The canvas remains visible beneath a smoky translucent overlay. */
body, button, input, select {
  font-family: "Courier New", Courier, monospace;
}
body { font-weight:700; }
#splash{
  /* Keep the existing canvas floor clearly visible behind the menu. */
  background:rgba(23,25,28,.28);
  background-image:linear-gradient(135deg, rgba(70,74,77,.12), rgba(20,22,24,.22));
  border-color:#777c73;
  box-shadow:inset 0 0 0 3px rgba(23,25,28,.72), inset 0 0 0 6px rgba(119,124,115,.42);
  backdrop-filter:none;
}
#splash h2{
  font-family:"Courier New", Courier, monospace;
  font-weight:900;
  letter-spacing:.06em;
  text-shadow:2px 0 #141914,-2px 0 #141914,0 2px #141914,0 -2px #141914,
    3px 3px 0 #141914,5px 5px 0 #141914;
}
#splash p, .hint, .score, button {
  font-family:"Courier New", Courier, monospace;
}
#splash p:first-of-type{letter-spacing:.07em}
.difficulty button, #play, #start, #pause, #sound, #music{
  font-weight:900;
}


#gameover{
  position:absolute;inset:0;z-index:4;
  display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;padding:clamp(16px,4vw,28px);text-align:center;
  border:4px solid #777c73;border-radius:3px;
  background:rgba(23,25,28,.9);
  box-shadow:inset 0 0 0 3px rgba(23,25,28,.8),inset 0 0 0 6px rgba(119,124,115,.42);
}
#gameover h2{margin:0;color:#b8433e;font-size:clamp(1.8rem,6vw,2.8rem);text-transform:uppercase;letter-spacing:.05em;text-shadow:3px 3px 0 #141914}
#gameover p{margin:0;color:#d0d4c8}
.result-grid{display:flex;gap:12px;justify-content:center;width:100%;max-width:340px}
.result-card{display:flex;flex:1;flex-direction:column;gap:8px;padding:12px 8px;background:#343a35;border:2px solid #777c73;box-shadow:inset 2px 2px 0 #50574f,0 3px 0 #151915}
.result-card span{font-size:.75rem;text-transform:uppercase;color:#c0c5b8;letter-spacing:.04em}
.result-card strong{font-size:clamp(1.8rem,7vw,2.5rem);color:#a4d486}
#record-message{min-height:1.2em;color:#e07a68!important;font-weight:900}
#retry{background:#b8433e;border-color:#e07a68;color:#fff0e7;min-width:170px}
#home{background:#414740;border-color:#777c73}


/* Mobile-first usability improvements */
html{min-height:100%;-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{
  min-height:100svh;
  padding:max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
  overscroll-behavior:none;
}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
canvas{touch-action:none;user-select:none;-webkit-user-select:none}
#board-wrap{width:100%;max-width:560px;margin-inline:auto}
@media(max-width:600px){
  body{display:block;padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
  main{width:100%;max-width:560px;margin:0 auto}
  .top{align-items:center;gap:8px;margin-bottom:8px}
  h1{font-size:clamp(1.45rem,7vw,2rem);margin-bottom:3px}
  .top .hint{font-size:11px;line-height:1.25;max-width:240px}
  .score{padding:7px 9px;white-space:nowrap;font-size:13px}
  canvas{width:100%;height:auto}
  .controls{margin-top:10px;gap:10px;align-items:center}
  .controls>div:first-child{flex:1;min-width:0}
  .controls>div:first-child>button{min-height:42px;padding:8px 10px;margin:0 4px 6px 0;font-size:12px}
  .controls .hint{font-size:10px;line-height:1.35;margin-top:4px!important}
  .pad{
    display:grid;
    flex:0 0 auto;
    grid-template-columns:repeat(3, minmax(44px, 15vw));
    grid-template-rows:repeat(2, minmax(44px, 13vw));
    gap:5px;
    margin:0 auto;
  }
  .pad button{
    min-width:44px;min-height:44px;width:100%;height:100%;
    padding:0;font-size:22px;border-width:2px;margin:0;
    touch-action:manipulation;
  }
  #splash,#gameover{padding:12px;gap:10px}
  #splash h2{font-size:clamp(1.6rem,8vw,2.3rem)}
  #splash p{font-size:12px}
  #splash p:first-of-type{font-size:11px}
  .difficulty{gap:7px}
  .difficulty button{min-width:76px;min-height:42px;padding:8px 10px;font-size:12px}
  #difficulty-description{font-size:11px}
  #play,#retry,#home{min-height:44px}
  .result-grid{gap:8px}
  .result-card{padding:9px 5px}
  .result-card span{font-size:10px}
  #countdown{font-size:clamp(4rem,22vw,7rem)}
}
@media(max-width:370px){
  .controls{align-items:flex-start}
  .controls>div:first-child{max-width:calc(100% - 148px)}
  .pad{grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,44px);gap:4px}
  .controls>div:first-child>button{font-size:10px;padding:7px}
  .top .hint{max-width:185px}
}

</style>
</head>
<body>
<main>
  <div class="top">
    <div><h1>Vibe Snek</h1><div class="hint">Eat the red food. Don’t hit the walls or yourself.</div></div>
    <div class="score">Score: <span id="score">0</span></div>
  </div>
  <div id="board-wrap">
    <canvas id="game" width="500" height="500" aria-label="Vibe Snek game board"></canvas>
    <div id="countdown" aria-live="assertive" aria-label="Game starts in three seconds">3</div>
    <section id="splash" aria-label="Choose difficulty">
      <h2>Vibe Snek</h2>
      <p>Choose your difficulty</p>
      <div class="difficulty">
        <button type="button" data-difficulty="easy" aria-pressed="false">Easy</button>
        <button type="button" data-difficulty="medium" aria-pressed="true">Medium</button>
        <button type="button" data-difficulty="hard" aria-pressed="false">Hard</button>
      </div>
      <p id="difficulty-description">Standard speed</p>
      <button type="button" id="play">Play</button>
    </section>
    <section id="gameover" aria-label="Game over" style="display:none">
      <h2 id="gameover-title">Game Over</h2>
      <p>Your run has ended.</p>
      <div class="result-grid">
        <div class="result-card"><span>Recent Score</span><strong id="recent-score">0</strong></div>
        <div class="result-card"><span>High Score</span><strong id="high-score">0</strong></div>
      </div>
      <p id="record-message" aria-live="polite"></p>
      <button type="button" id="retry">Try Again</button>
      <button type="button" id="home">Main Menu</button>
    </section>
  </div>
  <div class="controls">
    <div>
      <button id="start">Start game</button>
      <button id="pause">Pause</button>
      <button id="sound" aria-pressed="true">SFX: On</button>
      <button id="music" aria-pressed="true">Music: On</button>
      <div class="hint" style="margin-top:9px">Arrows or WASD (W↑ A← S↓ D→) · Space to pause · Enter to restart</div>
    </div>
    <div class="pad" aria-label="Touch controls">
      <button class="up" data-dir="up" aria-label="Up">▲</button>
      <button class="left" data-dir="left" aria-label="Left">◀</button>
      <button class="down" data-dir="down" aria-label="Down">▼</button>
      <button class="right" data-dir="right" aria-label="Right">▶</button>
    </div>
  </div>
</main>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const startBtn = document.getElementById('start');
  const pauseBtn = document.getElementById('pause');
  const soundBtn = document.getElementById('sound');
  const musicBtn = document.getElementById('music');
  const splash = document.getElementById('splash');
  const gameOverPanel = document.getElementById('gameover');
  const recentScoreEl = document.getElementById('recent-score');
  const highScoreEl = document.getElementById('high-score');
  const recordMessageEl = document.getElementById('record-message');
  const retryBtn = document.getElementById('retry');
  const homeBtn = document.getElementById('home');
  const playBtn = document.getElementById('play');
  const difficultyDescription = document.getElementById('difficulty-description');
  const countdownEl = document.getElementById('countdown');
  const cells = 20, size = canvas.width / cells;
  let difficulty = 'medium';
  const speeds = { easy: 230, medium: 115, hard: 115 };
  // Hard mode starts at Medium speed, then accelerates 1% every 5 dots.
  function currentSnakeSpeed() {
    const base = speeds[difficulty];
    if (difficulty !== 'hard') return base;
    const accelerationSteps = Math.floor(score / 5);
    return Math.max(45, base / Math.pow(1.01, accelerationSteps));
  }
  function getHighScore(mode) {
    try { return Number(localStorage.getItem('dungeonSnakeHighScore_' + mode) || 0); }
    catch (_) { return 0; }
  }
  function saveHighScore(mode, value) {
    try { localStorage.setItem('dungeonSnakeHighScore_' + mode, String(value)); }
    catch (_) { /* High scores are optional if browser storage is unavailable. */ }
  }
  function showGameOver() {
    const previousBest = getHighScore(difficulty);
    const newRecord = score > previousBest;
    const best = Math.max(score, previousBest);
    if (newRecord) saveHighScore(difficulty, score);
    recentScoreEl.textContent = String(score);
    highScoreEl.textContent = String(best);
    recordMessageEl.textContent = newRecord ? 'NEW HIGH SCORE!' : 'Difficulty: ' + difficulty.toUpperCase();
    splash.style.display = 'none';
    gameOverPanel.style.display = 'flex';
  }
  let snake, dir, nextDir, food, score, timer = null;
  let running = false, over = false, paused = false;
  let countdownTimer = null, countdownActive = false;
  let gamepadPreviousButtons = [], gamepadPreviousDirection = null;
  let soundEnabled = true, audioContext = null;
  let musicEnabled = true, musicMutedByState = true;
  let musicNodes = [], musicTimer = null, musicStep = 0;

  const dirs = {
    up:{x:0,y:-1}, down:{x:0,y:1},
    left:{x:-1,y:0}, right:{x:1,y:0}
  };

  // Generate arcade-style sound effects directly in the browser.
  function tone(frequency, duration, type='sine', volume=0.045, endFrequency=frequency) {
    if (!soundEnabled) return;
    try {
      audioContext = audioContext || new (window.AudioContext || window.webkitAudioContext)();
      if (audioContext.state === 'suspended') audioContext.resume();
      const now = audioContext.currentTime;
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();
      oscillator.type = type;
      oscillator.frequency.setValueAtTime(frequency, now);
      oscillator.frequency.exponentialRampToValueAtTime(Math.max(1,endFrequency), now+duration);
      gain.gain.setValueAtTime(volume, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now+duration);
      oscillator.connect(gain);
      gain.connect(audioContext.destination);
      oscillator.start(now);
      oscillator.stop(now+duration);
    } catch (_) { /* Game remains playable if audio is unavailable. */ }
  }
  function startSound() {
    tone(440,.09,'sine',.04,660);
    setTimeout(()=>tone(660,.11,'sine',.04,880),90);
  }
  function eatSound() { tone(620,.07,'triangle',.055,980); }
  function gameOverSound() {
    tone(330,.22,'sawtooth',.035,165);
    setTimeout(()=>tone(165,.32,'triangle',.04,75),180);
  }
  function pauseSound(resuming) {
    tone(resuming?520:360,.09,'sine',.035,resuming?720:260);
  }

  // Procedural retro dungeon music: square-wave melody + soft triangle bass.
  // No audio files or external libraries are used.
  const melody = [0, 3, 7, 10, 7, 3, 5, 2, 0, 3, 8, 7, 5, 3, 2, -2];
  const bass = [0, 0, -5, -5, -3, -3, -7, -7];
  const noteHz = n => 110 * Math.pow(2, n / 12);

  function musicNote(freq, duration, when, type, volume) {
    if (!audioContext || !musicEnabled || musicMutedByState) return;
    const osc = audioContext.createOscillator();
    const gain = audioContext.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, when);
    gain.gain.setValueAtTime(0.0001, when);
    gain.gain.linearRampToValueAtTime(volume, when + 0.012);
    gain.gain.setValueAtTime(volume, Math.max(when + 0.013, when + duration - 0.025));
    gain.gain.exponentialRampToValueAtTime(0.0001, when + duration);
    osc.connect(gain);
    gain.connect(audioContext.destination);
    osc.start(when);
    osc.stop(when + duration + 0.01);
    musicNodes.push(osc);
    osc.onended = () => { musicNodes = musicNodes.filter(node => node !== osc); };
  }

  function musicTick() {
    if (!musicEnabled || musicMutedByState || !audioContext || audioContext.state !== 'running') return;
    const now = audioContext.currentTime + 0.025;
    const step = musicStep % melody.length;
    // Gentle, minor-key chiptune melody and a bass note every other step.
    musicNote(noteHz(12 + melody[step]), 0.19, now, 'square', 0.018);
    if (step % 2 === 0) {
      const bassStep = Math.floor(step / 2) % bass.length;
      musicNote(noteHz(-12 + bass[bassStep]), 0.34, now, 'triangle', 0.035);
    }
    musicStep++;
  }

  function stopMusicScheduler() {
    if (musicTimer !== null) {
      clearInterval(musicTimer);
      musicTimer = null;
    }
  }

  function ensureAudioContext() {
    try {
      if (!audioContext) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return null;
        audioContext = new AudioContextClass();
      }
      if (audioContext.state === 'suspended') {
        // Calling this from a click/key gesture is important in browsers that
        // block audio until the user explicitly interacts with the page.
        const resumeResult = audioContext.resume();
        if (resumeResult && typeof resumeResult.catch === 'function') {
          resumeResult.catch(() => {});
        }
      }
      return audioContext;
    } catch (_) {
      return null;
    }
  }

  // Music accelerates every 20 dots, with a cap to keep the chiptune readable.
  function musicIntervalMs() {
    const tempoSteps = Math.floor(score / 20);
    return Math.max(105, 210 - tempoSteps * 15);
  }

  function updateMusicState() {
    const shouldPlay = musicEnabled && running && !paused && !over;
    musicMutedByState = !shouldPlay;
    if (shouldPlay) {
      if (!ensureAudioContext()) return;
      if (musicTimer === null) {
        musicTick();
        musicTimer = setInterval(musicTick, musicIntervalMs());
      }
    } else {
      stopMusicScheduler();
      // Stop currently sounding notes promptly when pausing, ending, or going home.
      musicNodes.forEach(node => { try { node.stop(); } catch (_) {} });
      musicNodes = [];
    }
  }

  function randomFood() {
    let p;
    do {
      p = {x:Math.floor(Math.random()*cells), y:Math.floor(Math.random()*cells)};
    } while (snake.some(s=>s.x===p.x && s.y===p.y));
    return p;
  }

  function reset() {
    clearInterval(timer);
    clearInterval(countdownTimer);
    timer = null;
    countdownTimer = null;
    countdownActive = true;
    countdownEl.textContent = '3';
    countdownEl.style.display = 'flex';

    snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
    dir = {x:1,y:0}; nextDir = dir;
    score = 0; over = false; paused = false; running = true;
    food = randomFood();
    scoreEl.textContent = score;
    startBtn.textContent = 'Restart';
    pauseBtn.textContent = 'Pause';
    splash.style.display = 'none';
    gameOverPanel.style.display = 'none';
    draw();

    let count = 3;
    countdownTimer = setInterval(() => {
      count--;
      if (count > 0) {
        countdownEl.textContent = String(count);
      } else {
        clearInterval(countdownTimer);
        countdownTimer = null;
        countdownActive = false;
        countdownEl.style.display = 'none';
        timer = setInterval(tick, currentSnakeSpeed());
        startSound();
        updateMusicState();
      }
    }, 1000);
    updateMusicState();
  }

  function setDirection(name) {
    const d = dirs[name];
    if (!d || over || countdownActive) return;
    if (d.x !== -dir.x || d.y !== -dir.y) nextDir = d;
    if (!running) reset();
  }

  function tick() {
    if (paused || over) return;
    dir = nextDir;
    const head = {x:snake[0].x+dir.x,y:snake[0].y+dir.y};
    const eating = head.x===food.x && head.y===food.y;
    // The tail moves on ordinary steps, but stays in place when food is eaten.
    const body = eating ? snake : snake.slice(0,-1);

    if (head.x<0 || head.x>=cells || head.y<0 || head.y>=cells ||
        body.some(s=>s.x===head.x && s.y===head.y)) {
      over = true; running = false; clearInterval(timer); timer = null;
      draw(); showGameOver(); updateMusicState(); gameOverSound(); return;
    }
    snake.unshift(head);

    if (eating) {
      score++;
      food = randomFood();
      eatSound();
      // Re-time the snake movement whenever Hard mode crosses a 5-dot milestone.
      if (difficulty === 'hard' && score % 5 === 0 && running && !paused && !over) {
        clearInterval(timer);
        timer = setInterval(tick, currentSnakeSpeed());
      }
      if (score % 20 === 0 && musicTimer !== null) {
        stopMusicScheduler();
        updateMusicState();
      }
    } else {
      snake.pop();
    }

    scoreEl.textContent = score;
    draw();
  }

    function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);

    // Classic NES-style dungeon floor: dark mortar, chipped gray stones,
    // pixel highlights, and occasional cracks. Keep shapes aligned to the grid.
    ctx.fillStyle = '#17191c';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    for (let gy=0; gy<cells; gy++) {
      for (let gx=0; gx<cells; gx++) {
        const x=gx*size, y=gy*size;
        const variation=((gx*17+gy*31+gx*gy*7)%5);
        const base=['#55585b','#5d6063','#626568','#515457','#686b6d'][variation];
        ctx.fillStyle='#17191c';
        ctx.fillRect(x,y,size,size);
        ctx.fillStyle=base;
        ctx.fillRect(x+1.5,y+1.5,size-3,size-3);
        // Top and left bevels catch a little light; lower edges stay dark.
        ctx.fillStyle='#85888a';
        ctx.fillRect(x+2,y+2,size-4,2);
        ctx.fillRect(x+2,y+2,2,size-4);
        ctx.fillStyle='#34373a';
        ctx.fillRect(x+2,y+size-4,size-4,2);
        ctx.fillRect(x+size-4,y+2,2,size-4);
        // Pixel-like stone flecks and chips.
        ctx.fillStyle='#777a7c';
        ctx.fillRect(x+5+((gx*3+gy)%5),y+5+((gx+gy*2)%4),3,2);
        ctx.fillStyle='#424548';
        ctx.fillRect(x+size-8-((gx+gy)%4),y+size-8,3,2);
        // Sparse cracks, deterministic so the floor does not flicker.
        if ((gx*7+gy*11)%13===0) {
          ctx.fillStyle='#292c2f';
          ctx.fillRect(x+size*.48,y+size*.27,2,size*.22);
          ctx.fillRect(x+size*.48,y+size*.43,size*.22,2);
          ctx.fillStyle='#777a7c';
          ctx.fillRect(x+size*.48-2,y+size*.27,2,size*.13);
        }
      }
    }

    // Pixel-art prehistoric steak: red meat with a chunky pale bone.
    function drawSteak(p) {
      const x=p.x*size, y=p.y*size, u=size/10;
      const meat = '#d83a2e';
      const meatLight = '#ff7560';
      const meatDark = '#7f201d';
      // Bone first, then the slab of meat.
      ctx.fillStyle='#fff0ce';
      ctx.fillRect(x+u*6.5,y+u*1.5,u*2,u*2);
      ctx.fillRect(x+u*7.5,y+u*2.5,u*1.5,u*3);
      ctx.fillRect(x+u*6,y+u*4,u*2.5,u*2);
      ctx.fillStyle='#b9b3a7';
      ctx.fillRect(x+u*7.5,y+u*3.5,u,u*2);
      ctx.fillStyle=meatDark;
      ctx.fillRect(x+u*1.5,y+u*3,u*5.5,u*5);
      ctx.fillRect(x+u*2.5,y+u*2,u*4.5,u*6);
      ctx.fillStyle=meat;
      ctx.fillRect(x+u*2,y+u*3,u*5,u*4.5);
      ctx.fillRect(x+u*3,y+u*2.5,u*3.5,u*5);
      ctx.fillStyle=meatLight;
      ctx.fillRect(x+u*3,y+u*3,u*2.5,u);
      ctx.fillRect(x+u*2,y+u*4,u,u*1.5);
      ctx.fillStyle=meatDark;
      ctx.fillRect(x+u*5.5,y+u*6,u*1.5,u);
    }
    if (food) drawSteak(food);
    // Classic 8-bit serpent: rounded pixel silhouette, belly plates, scales,
    // directional head with paired eyes, and a tapered tail. Movement/collisions
    // remain grid-based; this is visual-only.
    const block = (x,y,w,h,color) => {
      ctx.fillStyle = color;
      ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));
    };
    snake.forEach((s,i)=>{
      const t = snake.length <= 1 ? 0 : i / (snake.length - 1);
      // Deep forest green at the head, fading to fresh light green at the tail.
      const hue = 112;
      const saturation = 62 - 12 * t;
      const light = 23 + 34 * t;
      const x=s.x*size, y=s.y*size;
      const u=size/16;
      const isHead=i===0, isTail=i===snake.length-1;
      let toward = {x:0,y:0};
      if (isHead) toward = dir;
      else {
        const ahead=snake[i-1];
        toward={x:Math.sign(ahead.x-s.x),y:Math.sign(ahead.y-s.y)};
      }
      let behind = {x:0,y:0};
      if (i < snake.length-1) {
        const next=snake[i+1];
        behind={x:Math.sign(next.x-s.x),y:Math.sign(next.y-s.y)};
      }
      const base=`hsl(${hue}, ${saturation}%, ${light}%)`;
      const hi=`hsl(${hue}, ${Math.min(88,saturation+10)}%, ${Math.min(82,light+18)}%)`;
      const shade=`hsl(${hue}, ${Math.min(80,saturation+8)}%, ${Math.max(9,light-14)}%)`;
      const outline='#202124';

      // Rounded-by-pixels outline. Heads are slightly broader; tails taper.
      let left=x+3*u, top=y+3*u, w=10*u, h=10*u;
      if (isHead) { left=x+2*u; top=y+2*u; w=12*u; h=12*u; }
      if (isTail) {
        if (toward.x!==0) { left=x+(toward.x>0?3:5)*u; w=8*u; }
        else { top=y+(toward.y>0?3:5)*u; h=8*u; }
      }
      block(left-1*u,top-1*u,w+2*u,h+2*u,outline);
      block(left,top,w,h,base);
      // Pixel highlights and side shadow give the body a raised reptile look.
      block(left+1*u,top+1*u,w-2*u,1.5*u,hi);
      block(left+1*u,top+1*u,1.5*u,h-2*u,hi);
      block(left+w-2*u,top+2*u,1.5*u,h-3*u,shade);
      block(left+2*u,top+h-2*u,w-3*u,1.5*u,shade);

      if (isHead) {
        // Snout projects toward the current heading.
        if (dir.x===1) {
          block(x+10*u,y+5*u,4*u,6*u,outline);
          block(x+11*u,y+6*u,4*u,4*u,hi);
          // paired eyes
          block(x+8*u,y+3*u,2.5*u,2.5*u,'#101419');
          block(x+8.5*u,y+3*u,1*u,1*u,'#050607');
          block(x+8*u,y+11*u,2.5*u,2.5*u,'#101419');
          block(x+8.5*u,y+11*u,1*u,1*u,'#050607');
          block(x+14*u,y+7*u,1*u,1*u,'#381a18');
        } else if (dir.x===-1) {
          block(x+2*u,y+5*u,4*u,6*u,outline);
          block(x+1*u,y+6*u,4*u,4*u,hi);
          block(x+5.5*u,y+3*u,2.5*u,2.5*u,'#101419');
          block(x+6*u,y+3*u,1*u,1*u,'#050607');
          block(x+5.5*u,y+11*u,2.5*u,2.5*u,'#101419');
          block(x+6*u,y+11*u,1*u,1*u,'#050607');
          block(x+1*u,y+7*u,1*u,1*u,'#381a18');
        } else if (dir.y===-1) {
          block(x+5*u,y+2*u,6*u,4*u,outline);
          block(x+6*u,y+1*u,4*u,4*u,hi);
          block(x+3*u,y+5.5*u,2.5*u,2.5*u,'#101419');
          block(x+3*u,y+6*u,1*u,1*u,'#050607');
          block(x+11*u,y+5.5*u,2.5*u,2.5*u,'#101419');
          block(x+11*u,y+6*u,1*u,1*u,'#050607');
          block(x+7*u,y+1*u,1*u,1*u,'#381a18');
        } else {
          block(x+5*u,y+10*u,6*u,4*u,outline);
          block(x+6*u,y+11*u,4*u,4*u,hi);
          block(x+3*u,y+8*u,2.5*u,2.5*u,'#101419');
          block(x+3*u,y+8.5*u,1*u,1*u,'#050607');
          block(x+11*u,y+8*u,2.5*u,2.5*u,'#101419');
          block(x+11*u,y+8.5*u,1*u,1*u,'#050607');
          block(x+7*u,y+14*u,1*u,1*u,'#381a18');
        }
      } else {
        // Alternating scale flecks along the spine, plus belly scutes.
        const offset=(i%2)*u;
        block(x+5*u+offset,y+4*u,2*u,1.2*u,hi);
        block(x+9*u-offset,y+7*u,2*u,1.2*u,shade);
        if (toward.x!==0) {
          block(x+5*u,y+9*u,5*u,1.5*u,`hsl(${hue}, 65%, ${Math.max(12,light-8)}%)`);
          block(x+6*u,y+9*u,3*u,0.8*u,hi);
        } else {
          block(x+9*u,y+5*u,1.5*u,5*u,`hsl(${hue}, 65%, ${Math.max(12,light-8)}%)`);
        }
      }
      // Tiny forked tongue on the head, only a few pixels beyond the snout.
      if (isHead) {
        ctx.fillStyle='#e85a58';
        if (dir.x===1) {
          block(x+15*u,y+7*u,1.5*u,1*u,'#e85a58');
          block(x+15*u,y+6*u,1*u,1*u,'#ff8580');
          block(x+15*u,y+8*u,1*u,1*u,'#ff8580');
        } else if (dir.x===-1) {
          block(x-0.5*u,y+7*u,1.5*u,1*u,'#e85a58');
          block(x-0.5*u,y+6*u,1*u,1*u,'#ff8580');
          block(x-0.5*u,y+8*u,1*u,1*u,'#ff8580');
        } else if (dir.y===-1) {
          block(x+7*u,y-0.5*u,1*u,1.5*u,'#e85a58');
          block(x+6*u,y-0.5*u,1*u,1*u,'#ff8580');
          block(x+8*u,y-0.5*u,1*u,1*u,'#ff8580');
        } else {
          block(x+7*u,y+15*u,1*u,1.5*u,'#e85a58');
          block(x+6*u,y+15*u,1*u,1*u,'#ff8580');
          block(x+8*u,y+15*u,1*u,1*u,'#ff8580');
        }
      }
    });

    if (!running || paused || over) {
      ctx.fillStyle = '#071016cc'; ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.textAlign='center'; ctx.fillStyle='#edf5f2'; ctx.font='700 30px system-ui';
      ctx.fillText(over?'Game over!':paused?'Paused':'Ready to play?',canvas.width/2,canvas.height/2-8);
      ctx.font='16px system-ui'; ctx.fillStyle='#b4c5ca';
      ctx.fillText(over?`Final score: ${score}`:
        paused?'Press Space or Pause to continue':'Press Start game or an arrow key',
        canvas.width/2,canvas.height/2+18);
      if (over) {
        ctx.font = '14px system-ui';
        ctx.fillText('Space: try again   ·   Enter: home', canvas.width/2, canvas.height/2+44);
      }
    }
  }

  function goHome() {
    clearInterval(timer);
    clearInterval(countdownTimer);
    timer = null;
    countdownTimer = null;
    countdownActive = false;
    countdownEl.style.display = 'none';
    running = false;
    over = false;
    paused = false;
    gameOverPanel.style.display = 'none';
    splash.style.display = 'flex';
    startBtn.textContent = 'Restart';
    pauseBtn.textContent = 'Pause';
    draw();
    updateMusicState();
  }

  function togglePause() {
    if (!running || over || countdownActive) return;
    paused = !paused;
    pauseBtn.textContent = paused ? 'Resume' : 'Pause';
    pauseSound(!paused);
    draw();
    updateMusicState();
  }

  // Mobile swipe controls: swipe across the board to steer.
  let touchStartX = 0, touchStartY = 0, touchStarted = false;
  canvas.addEventListener('touchstart', e => {
    if (!e.changedTouches || !e.changedTouches.length) return;
    const t = e.changedTouches[0];
    touchStartX = t.clientX;
    touchStartY = t.clientY;
    touchStarted = true;
    e.preventDefault();
  }, {passive:false});
  canvas.addEventListener('touchmove', e => {
    // Prevent the page from scrolling while the player is steering.
    e.preventDefault();
  }, {passive:false});
  canvas.addEventListener('touchend', e => {
    if (!touchStarted || !e.changedTouches || !e.changedTouches.length) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    touchStarted = false;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 18) return;
    ensureAudioContext();
    if (Math.abs(dx) > Math.abs(dy)) setDirection(dx > 0 ? 'right' : 'left');
    else setDirection(dy > 0 ? 'down' : 'up');
    e.preventDefault();
  }, {passive:false});
  canvas.addEventListener('touchcancel', () => { touchStarted = false; }, {passive:true});

  document.addEventListener('keydown',e=>{
    const map = {
      ArrowUp:'up', w:'up', W:'up',
      ArrowLeft:'left', a:'left', A:'left',
      ArrowDown:'down', s:'down', S:'down',
      ArrowRight:'right', d:'right', D:'right'
    };
    if (map[e.key]) {
      e.preventDefault();
      if (!running) ensureAudioContext();
      setDirection(map[e.key]);
    }
    else if (e.code==='Space') {
      e.preventDefault();
      if (over) reset();
      else togglePause();
    }
    else if (e.key==='Enter') {
      if (over) goHome();
      else reset();
    }
  });
  // Bluetooth / USB controller support through the browser Gamepad API.
  // Standard mapping: D-pad buttons 12–15, A/Cross button 0, Start/Options button 9.
  function pollGamepad() {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    let pad = null;
    for (let i = 0; i < pads.length; i++) {
      if (pads[i] && pads[i].connected) { pad = pads[i]; break; }
    }

    if (pad) {
      const pressed = index => !!(pad.buttons[index] && pad.buttons[index].pressed);
      const wasPressed = index => !!gamepadPreviousButtons[index];
      const aPressed = pressed(0);
      const startPressed = pressed(9);

      // A / Cross starts or restarts. The edge check prevents held buttons
      // from repeatedly restarting the game.
      if (aPressed && !wasPressed(0)) {
        ensureAudioContext();
        if (!running || over) reset();
      }
      // Start / Options toggles pause while a game is active.
      if (startPressed && !wasPressed(9)) {
        if (running && !over && !countdownActive) togglePause();
      }

      let direction = null;
      // D-pad takes priority over the analog stick.
      if (pressed(12)) direction = 'up';
      else if (pressed(13)) direction = 'down';
      else if (pressed(14)) direction = 'left';
      else if (pressed(15)) direction = 'right';
      else {
        const x = pad.axes && pad.axes.length > 0 ? pad.axes[0] : 0;
        const y = pad.axes && pad.axes.length > 1 ? pad.axes[1] : 0;
        const deadZone = 0.55;
        if (Math.abs(x) > deadZone || Math.abs(y) > deadZone) {
          if (Math.abs(x) > Math.abs(y)) direction = x < 0 ? 'left' : 'right';
          else direction = y < 0 ? 'up' : 'down';
        }
      }

      // Re-apply a held direction every animation frame. This keeps the turn
      // buffered until the next grid step, rather than relying only on a new
      // button edge; the snake still cannot reverse directly into itself.
      if (direction && running && !paused && !over && !countdownActive) {
        setDirection(direction);
      }
      gamepadPreviousDirection = direction;
      gamepadPreviousButtons = pad.buttons.map(button => !!button.pressed);
    } else {
      gamepadPreviousButtons = [];
      gamepadPreviousDirection = null;
    }

    requestAnimationFrame(pollGamepad);
  }
  window.addEventListener('gamepadconnected', () => {
    gamepadPreviousButtons = [];
    gamepadPreviousDirection = null;
  });
  window.addEventListener('gamepaddisconnected', () => {
    gamepadPreviousButtons = [];
    gamepadPreviousDirection = null;
  });
  requestAnimationFrame(pollGamepad);

  document.querySelectorAll('[data-dir]').forEach(b=>
    b.addEventListener('click',()=>setDirection(b.dataset.dir))
  );
  startBtn.addEventListener('click', () => {
    ensureAudioContext();
    reset();
  });
  pauseBtn.addEventListener('click',togglePause);
  document.querySelectorAll('[data-difficulty]').forEach(button => {
    button.addEventListener('click', () => {
      difficulty = button.dataset.difficulty;
      document.querySelectorAll('[data-difficulty]').forEach(option =>
        option.setAttribute('aria-pressed', String(option === button))
      );
      difficultyDescription.textContent = difficulty === 'easy'
        ? 'Half speed · Relaxed play'
        : difficulty === 'hard'
          ? 'Starts at Medium speed · +1% speed every 5 dots'
          : 'Standard speed';
    });
  });
  retryBtn.addEventListener('click', () => {
    ensureAudioContext();
    reset();
  });
  homeBtn.addEventListener('click', goHome);
  playBtn.addEventListener('click', () => {
    ensureAudioContext();
    reset();
  });
  soundBtn.addEventListener('click',()=>{
    soundEnabled = !soundEnabled;
    soundBtn.textContent = soundEnabled ? 'SFX: On' : 'SFX: Off';
    soundBtn.setAttribute('aria-pressed',String(soundEnabled));
    if (soundEnabled) tone(520,.08,'sine',.035,700);
  });
  musicBtn.addEventListener('click',()=>{
    musicEnabled = !musicEnabled;
    musicBtn.textContent = musicEnabled ? 'Music: On' : 'Music: Off';
    musicBtn.setAttribute('aria-pressed',String(musicEnabled));
    if (musicEnabled) ensureAudioContext();
    updateMusicState();
  });

  snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir = {x:1,y:0}; nextDir = dir; score = 0;
  food = randomFood(); draw();
  updateMusicState();
})();
</script>
</body>
</html>
